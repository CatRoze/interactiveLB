<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katroz | Исследование</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f5f0;
            --text-main: #2b2b2b;
            --accent-color: #8b7d6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none; /* Запрещаем выделять текст/картинки при перетаскивании */
        }

        /* Шапка */
        header {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none; 
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 10px rgba(247, 245, 240, 0.8);
        }
        header p {
            font-size: 0.8rem;
            color: #444;
            margin-top: 10px;
            letter-spacing: 0.1em;
            text-shadow: 0 0 5px rgba(247, 245, 240, 0.9);
        }

        /* Контейнер для панорамы */
        .panorama-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Скрываем скроллы, будем двигать через JS */
            cursor: grab; /* Курсор в виде ручки */
        }
        .panorama-container:active { cursor: grabbing; }

           /* Сама панорама */
        .panorama-track {
            width: 300vw;
            height: 100vh;
            position: relative;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            transition: transform 0.1s linear; /* Плавность при движении */
        }

        /* Пульсирующие точки */
        .hotspot {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(139, 125, 107, 0.7);
            animation: pulse 2s infinite;
            transition: transform 0.3s;
            z-index: 5;
        }
        .hotspot:hover { transform: scale(1.2); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 125, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(139, 125, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 125, 107, 0); }
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 245, 240, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; animation: fadeIn 0.4s ease; }

        .modal-content {
            background: #fff;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .modal-img {
            width: 100%;
            height: 300px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .modal-text { padding: 30px; }
        .modal-text h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 10px; }
        .modal-text p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .modal-btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: var(--text-main);
            padding: 12px 30px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 2rem; cursor: pointer; color: #333;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>Katroz</h1>
        <p>Зажмите и потяните, чтобы исследовать</p>
    </header>

    <!-- Панорама -->
    <div class="panorama-container" id="panorama-container">
        <div class="panorama-track" id="panorama-track">
            
            <!-- Точки (Координаты: top - сверху, left - слева) -->
            <div class="hotspot" style="top: 50%; left: 20%;" onclick="openModal(1)"></div>
            <div class="hotspot" style="top: 60%; left: 50%;" onclick="openModal(2)"></div>
            <div class="hotspot" style="top: 40%; left: 85%;" onclick="openModal(1)"></div>

        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-img" id="modal-image">Фото предмета</div>
            <div class="modal-text">
                <h2 id="modal-title">Название</h2>
                <p id="modal-desc">Описание.</p>
                <a href="https://t.me/ВАШ_НИК" class="modal-btn" target="_blank">Запросить</a>
            </div>
        </div>
    </div>

    <script>
        // --- СКРИПТ ПЕРЕТАСКИВАНИЯ ---
        const container = document.getElementById('panorama-container');
        const track = document.getElementById('panorama-track');
        // Автоматический старт с центра
        container.scrollLeft = container.scrollWidth / 3;
        
        let isDown = false;
        let startX;
        let scrollLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
        });

        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });

        container.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5; // Скорость прокрутки
            container.scrollLeft = scrollLeft - walk;
        });

        // --- СКРИПТ ОКОН ---
        const items = {
            1: { title: "Сумка «Тепло»", desc: "Натуральная кожа.", img: "Фото сумки" },
            2: { title: "Серьги «Камень»", desc: "Гладкий камень.", img: "Фото серег" }
        };

        function openModal(id) {
            const item = items[id];
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.desc;
            document.getElementById('modal-image').innerHTML = item.img;
            document.getElementById('myModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('myModal').classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('myModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
