<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katroz | Исследование</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           ЦВЕТОВАЯ ГАММА
           ========================================= */
        :root {
            --bg-color: #f7f5f0;
            --text-main: #2b2b2b;
            --accent-color: #8b7d6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none; 
        }

        /* Шапка */
        header {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none; 
        }
        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 10px rgba(247, 245, 240, 0.8);
        }
        header p {
            font-size: 0.8rem;
            color: #444;
            margin-top: 10px;
            letter-spacing: 0.1em;
            text-shadow: 0 0 5px rgba(247, 245, 240, 0.9);
        }

        /* Контейнер для панорамы */
        .panorama-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            cursor: grab; 
        }
        .panorama-container:active { cursor: grabbing; }

        /* Сама панорама */
        .panorama-track {
            width: 300vw;
            height: 100vh;
            position: relative;
            background-image: url('bg.png'); /* Твоя картинка */
            background-size: cover;
            background-position: center;
            transition: transform 0.1s linear;
        }

        /* НЕВИДИМЫЕ ЗОНЫ КЛИКА (Рамки) */
        /* Ты будешь двигать их так же, как раньше двигала точки */
        .click-zone {
            position: absolute;
            /* Размеры по умолчанию (можно менять для каждой рамки отдельно) */
            width: 8vw; 
            height: 25vh;
            background-color: rgba(255, 255, 255, 0); /* Абсолютно прозрачные */
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        /* Модальное окно (всплывающее) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 245, 240, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; animation: fadeIn 0.4s ease; }

        .modal-content {
            background: #fff;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .modal-img {
            width: 100%;
            height: 400px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .modal-text { padding: 30px; }
        .modal-text h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 10px; }
        .modal-text p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .modal-btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: var(--text-main);
            padding: 12px 30px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 2rem; cursor: pointer; color: #333;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1>Katroz</h1>
        <p>Зажмите и потяните, чтобы исследовать</p>
    </header>

    <!-- Панорама -->
    <div class="panorama-container" id="panorama-container">
        <div class="panorama-track" id="panorama-track">
            
            <!-- СЮДА МЫ БУДЕМ ДОБАВЛЯТЬ ЗОНЫ КЛИКА -->
            <!-- Пример 1: Первая рамка (координаты, ширина и высота) -->
            <!-- style="top: 50%; left: 10%; width: 10vw; height: 30vh;" -->
            
            <div class="click-zone" style="top: 40%; left: 15%; width: 9vw; height: 35vh;" onclick="openModal(1)"></div>
            
            <!-- Пример 2: Вторая рамка -->
            <div class="click-zone" style="top: 45%; left: 30%; width: 6vw; height: 25vh;" onclick="openModal(2)"></div>

            <!-- Пример 3: Третья рамка -->
            <div class="click-zone" style="top: 35%; left: 50%; width: 12vw; height: 45vh;" onclick="openModal(1)"></div>

        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-img" id="modal-image">Фото предмета</div>
            <div class="modal-text">
                <h2 id="modal-title">Название</h2>
                <p id="modal-desc">Описание.</p>
                <a href="https://t.me/ВАШ_НИК" class="modal-btn" target="_blank">Запросить</a>
            </div>
        </div>
    </div>

    <script>
        // --- СКРИПТ ПЕРЕТАСКИВАНИЯ ---
        const container = document.getElementById('panorama-container');
        
        let isDown = false;
        let startX;
        let scrollLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
        });

        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });

        container.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5;
            container.scrollLeft = scrollLeft - walk;
        });

        // Автоматический старт с центра
        container.scrollLeft = container.scrollWidth / 3;

        // --- СКРИПТ ОКОН ---
        const items = {
            1: { 
                title: "Сумка «Тепло»", 
                desc: "Натуральная кожа. Идеально ложится в руку.", 
                img: "<img src='item1.jpg' style='width:100%; height:100%; object-fit:cover;'>" 
            },
            2: { 
                title: "Серьги «Камень»", 
                desc: "Гладкий камень, ручная сборка.", 
                img: "<img src='item2.jpg' style='width:100%; height:100%; object-fit:cover;'>" 
            }
        };

        function openModal(id) {
            const item = items[id];
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.desc;
            document.getElementById('modal-image').innerHTML = item.img;
            document.getElementById('myModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('myModal').classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('myModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
